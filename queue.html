<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Queue Simulator</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="simulator-container">

    <!-- HEADER -->

    <div class="page-header">

        <a href="index.html" class="home-btn">
            ← Home
        </a>

        <h1>QUEUE SIMULATOR</h1>

        <p>Visualize Queue Operations Easily</p>

    </div>


    <!-- TOP SECTION -->

    <div class="top-section">


        <!-- LEFT SIDE -->

        <div class="left-panel">


            <!-- QUEUE SIZE -->

            <div class="size-box">

                <label>Queue Size</label>

                <input
                    type="number"
                    id="queueSize"
                    value="5"
                    min="1"
                >

                <button onclick="setSize()">
                    Set Size
                </button>

            </div>


            <!-- OPERATIONS -->

            <div class="operations-box">

                <h2>Queue Operations</h2>


                <!-- INPUT -->

                <div class="input-row">

                    <input
                        type="number"
                        id="valueInput"
                        placeholder="Enter value"
                    >

                    <button
                        class="push-btn"
                        onclick="enqueueElement()"
                    >
                        Enqueue
                    </button>

                </div>


                <!-- BUTTONS -->

                <div class="operation-buttons">

                    <button onclick="dequeueElement()">
                        Dequeue
                    </button>

                    <button onclick="peekElement()">
                        Peek
                    </button>

                    <button onclick="displayQueue()">
                        Display
                    </button>

                    <button
                        class="reset-btn"
                        onclick="resetQueue()"
                    >
                        Reset
                    </button>

                </div>


                <!-- MESSAGE -->

                <div id="message" class="message">
                    Queue is ready
                </div>

            </div>

        </div>


        <!-- RIGHT SIDE -->

        <div class="right-panel">

            <h2>Queue Visualization</h2>


            <!-- QUEUE -->

            <div class="queue-area">

                <div class="front-label">
                    FRONT
                </div>


                <div id="queue"></div>


                <div class="rear-label">
                    REAR
                </div>

            </div>


            <!-- HISTORY -->

            <div class="history-box">

                <h2>Operation History</h2>

                <div id="history">
                    <p>No operations yet.</p>
                </div>

            </div>

        </div>

    </div>


    <!-- STATUS CARDS -->

    <div class="status-section">


        <div class="status-card">

            <span>IS EMPTY</span>

            <strong id="isEmpty">
                No
            </strong>

        </div>


        <div class="status-card">

            <span>IS FULL</span>

            <strong id="isFull">
                No
            </strong>

        </div>


        <div class="status-card">

            <span>SIZE</span>

            <strong id="sizeDisplay">
                5
            </strong>

        </div>


        <div class="status-card">

            <span>ELEMENTS</span>

            <strong id="elements">
                0 / 5
            </strong>

        </div>


        <div class="status-card">

            <span>FRONT ELEMENT</span>

            <strong id="frontElement">
                -
            </strong>

        </div>


        <div class="status-card">

            <span>REAR ELEMENT</span>

            <strong id="rearElement">
                -
            </strong>

        </div>


        <div class="status-card">

            <span>OPERATION</span>

            <strong id="operation">
                None
            </strong>

        </div>


        <div class="status-card">

            <span>STATE</span>

            <strong id="state">
                Ready
            </strong>

        </div>

    </div>

</div>


<script src="js/queue.js"></script>

</body>

</html>
